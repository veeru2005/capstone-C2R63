# LIVE DEMO for the mentor: "a new container starts -> it appears on the dashboard".
#
#   kubectl apply  -f k8s/demo-new-app.yaml     # deploy
#   (wait ~1-2 min, watch the "Live Workloads" panel -> demo/forgotten-test-app shows IDLE)
#   kubectl delete -f k8s/demo-new-app.yaml     # clean up
#
# It requests 1 full CPU and does nothing — exactly the kind of waste the project finds.
---
apiVersion: v1
kind: Namespace
metadata: { name: demo, labels: { team: demo-team } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: forgotten-test-app, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: forgotten-test-app } }
  template:
    metadata: { labels: { app: forgotten-test-app, team: demo-team } }
    spec:
      containers:
        - name: sleeper
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi }
